name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.16.5

      - name: Lint backend
        working-directory: backend
        run: ruff check . --output-format=github

      - name: Format check backend
        working-directory: backend
        run: ruff format --check .

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexara
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nexara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Verify migrations apply cleanly on a fresh database
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+asyncpg://nexara:test@localhost:5432/nexara_test"
          SECRET_KEY: "test-key-do-not-use-in-production"
          SMTP_HOST: "localhost"
          SMTP_PORT: "587"
          SMTP_USERNAME: "test"
          SMTP_PASSWORD: "test"
          SMTP_FROM_EMAIL: "noreply@example.com"
          SMTP_FROM_NAME: "Nexara"
        run: |
          alembic upgrade head
          test "$(alembic heads | wc -l)" -eq 1

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+asyncpg://nexara:test@localhost:5432/nexara_test"
          SECRET_KEY: "test-key-do-not-use-in-production"
          SMTP_HOST: "localhost"
          SMTP_PORT: "587"
          SMTP_USERNAME: "test"
          SMTP_PASSWORD: "test"
          SMTP_FROM_EMAIL: "noreply@example.com"
          SMTP_FROM_NAME: "Nexara"
        run: python -m pytest test_all.py -x -q -o faulthandler_timeout=120

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend crypto tests
        working-directory: frontend
        run: node --test all.test.js

      - name: Run Vitest component tests
        working-directory: frontend
        run: npx vitest run

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexara
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nexara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Apply migrations
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+asyncpg://nexara:test@localhost:5432/nexara_test"
          NEXARA_APP_PASSWORD: "app_pass_test"
          SECRET_KEY: "test-key-do-not-use-in-production"
          SMTP_HOST: "localhost"
          SMTP_PORT: "587"
          SMTP_USERNAME: "test"
          SMTP_PASSWORD: "test"
          SMTP_FROM_EMAIL: "noreply@example.com"
          SMTP_FROM_NAME: "Nexara"
        run: alembic upgrade head

      - name: Start the API (DEBUG; OTPs go to a log file)
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+asyncpg://nexara_app:app_pass_test@localhost:5432/nexara_test"
          SECRET_KEY: "test-key-do-not-use-in-production"
          SMTP_HOST: "localhost"
          SMTP_PORT: "587"
          SMTP_USERNAME: "test"
          SMTP_PASSWORD: "test"
          SMTP_FROM_EMAIL: "noreply@example.com"
          SMTP_FROM_NAME: "Nexara"
          DEBUG: "true"
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/nexara-backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/healthz >/dev/null && exit 0
            sleep 1
          done
          echo "API did not become ready" >&2
          tail -50 /tmp/nexara-backend.log >&2
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: frontend
        env:
          BACKEND_LOG: "/tmp/nexara-backend.log"
        run: npx playwright test

  rls-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexara
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nexara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt websocket-client

      - name: Install postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply migrations under the superuser and set the app-role password
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+asyncpg://nexara:test@localhost:5432/nexara_test"
          NEXARA_APP_PASSWORD: "app_pass_test"
          SECRET_KEY: "test-key-do-not-use-in-production"
          SMTP_HOST: "localhost"
          SMTP_PORT: "587"
          SMTP_USERNAME: "test"
          SMTP_PASSWORD: "test"
          SMTP_FROM_EMAIL: "noreply@example.com"
          SMTP_FROM_NAME: "Nexara"
        run: alembic upgrade head

      - name: Start the API connected as the least-privilege nexara_app role
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+asyncpg://nexara_app:app_pass_test@localhost:5432/nexara_test"
          SECRET_KEY: "test-key-do-not-use-in-production"
          SMTP_HOST: "localhost"
          SMTP_PORT: "587"
          SMTP_USERNAME: "test"
          SMTP_PASSWORD: "test"
          SMTP_FROM_EMAIL: "noreply@example.com"
          SMTP_FROM_NAME: "Nexara"
          DEBUG: "true"
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/nexara-backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/healthz >/dev/null && exit 0
            sleep 1
          done
          echo "API did not become ready" >&2
          tail -50 /tmp/nexara-backend.log >&2
          exit 1

      - name: Run RLS smoke test
        working-directory: backend
        env:
          RLS_BASE_URL: "http://127.0.0.1:8000/api/v1"
          RLS_OTP_LOG: "/tmp/nexara-backend.log"
          PGPASSWORD: "app_pass_test"
        run: python smoke_rls.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner on backend
        # Pinned post the 2026-03-19 supply-chain compromise of
        # trivy-action tags <=0.34.2; v0.35.0+ are clean releases.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "backend"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          trivyignores: ".trivyignore"

      - name: Run Trivy vulnerability scanner on frontend
        # Pinned post the 2026-03-19 supply-chain compromise of
        # trivy-action tags <=0.34.2; v0.35.0+ are clean releases.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "frontend"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          trivyignores: ".trivyignore"

  build:
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend, backend-test, frontend-test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t nexara-backend ./backend

      - name: Build frontend image
        run: docker build -t nexara-frontend ./frontend
