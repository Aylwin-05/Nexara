# Nexara Coturn TURN Server Configuration
# This file is mounted into the coturn container

# Listening ports
listening-port=3478
tls-listening-port=5349

# Use fingerprint in TURN messages
fingerprint

# Use long-term credential mechanism
lt-cred-mech

# Use authentication secret (set via environment variable)
use-auth-secret
static-auth-secret=${TURN_SECRET}

# Realm (domain) - set via environment variable
realm=${TURN_REALM}

# Total quota (max concurrent connections per IP)
total-quota=100

# Stale nonce (seconds before nonce expires)
stale-nonce=600

# Disable multicast peers
no-multicast-peers

# Logging
log-file=stdout
verbose

# Denied peer IPs (prevent TURN from accessing local network - security)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# Allow loopback (for health checks)
allowed-peer-ip=127.0.0.1

# Max bandwidth per user (5 Mbps for HD video)
max-bps=5000000

# User quota (max sessions per user)
user-quota=10

# No CLI (we're running in Docker)
no-cli

# Prometheus metrics on port 9641 (optional)
prometheus
