# ============================================================
# Development nginx config — HTTP only
# ============================================================
# Used by docker-compose.yml (dev). No TLS.
# See nginx.prod.conf for the production variant.

# Worker processes drop privileges; master stays root to bind :80.
user nginx;

# Security headers as variables so locations that set their own
# headers can repeat them (nginx add_header is not inherited into a
# block that has its own add_header). Cache-Control is done with
# `expires`, which never interferes with add_header inheritance.
# CSP allow-lists fonts.googleapis.com for the Google Fonts stylesheet
# and fonts.gstatic.com for the files (see F-13).
set $sec_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss: ws:; worker-src 'self' blob:; font-src 'self' https://fonts.gstatic.com";
set $sec_nosniff "nosniff";
set $sec_frame "DENY";
set $sec_ref "no-referrer";
set $sec_perm "geolocation=(), microphone=(), camera=()";

server {
    listen 80;
    server_name _;

    # Container healthcheck.
    location = /healthz {
        access_log off;
        return 200;
    }

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 600m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml font/woff2;

    add_header X-Content-Type-Options "$sec_nosniff" always;
    add_header X-Frame-Options "$sec_frame" always;
    add_header Referrer-Policy "$sec_ref" always;
    add_header Permissions-Policy "$sec_perm" always;
    add_header Content-Security-Policy "$sec_csp" always;

    location = /index.html {
        expires -1;
        add_header X-Content-Type-Options "$sec_nosniff" always;
        add_header X-Frame-Options "$sec_frame" always;
        add_header Referrer-Policy "$sec_ref" always;
        add_header Permissions-Policy "$sec_perm" always;
        add_header Content-Security-Policy "$sec_csp" always;
    }

    location /assets/ {
        expires 1y;
        add_header X-Content-Type-Options "$sec_nosniff" always;
        add_header X-Frame-Options "$sec_frame" always;
        add_header Referrer-Policy "$sec_ref" always;
        add_header Permissions-Policy "$sec_perm" always;
        add_header Content-Security-Policy "$sec_csp" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    location ~ /\. {
        deny all;
    }
}
