<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M16 2l12 4v8c0 8-5 14-12 16C9 28 4 22 4 14V6z' fill='url(%23g)'/%3E%3C/svg%3E"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#070b18" />
    <meta
      name="description"
      content="Nexara — end-to-end encrypted messaging"
    />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nexara" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Nexara</title>
    <style>
      /* Pre-React paint: shown only in the blank window before the
         bundle mounts. Matches the default (blue) theme; React
         replaces #root and takes over with real themed loaders. */
      .boot-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: #070b18;
      }
      .boot-loading span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: linear-gradient(135deg, #7c5cff 0%, #22d3ee 100%);
        opacity: 0.35;
        animation: boots 1.2s ease-in-out infinite;
      }
      .boot-loading span:nth-child(2) { animation-delay: 0.18s; }
      .boot-loading span:nth-child(3) { animation-delay: 0.36s; }
      @keyframes boots {
        0%, 100% { opacity: 0.3; transform: scale(0.9); }
        40% { opacity: 1; transform: scale(1.15); }
      }
    </style>
  </head>

  <body>
    <div id="root"><div class="boot-loading"><span></span><span></span><span></span></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
