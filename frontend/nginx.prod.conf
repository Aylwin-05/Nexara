# ============================================================
# Production nginx config — HTTPS with automatic certbot renewal
# ============================================================
# Mounted by docker-compose.prod.yml AS A TEMPLATE at
# /etc/nginx/templates/default.conf.template. The official nginx
# image entrypoint envsubsts it (only defined env vars are replaced,
# so nginx's own $host/$remote_addr etc. are untouched). Set the
# DOMAIN env var or this container will not start.
#
# Expects certificates at /etc/letsencrypt/live/$DOMAIN/.
#
# First run (no certs yet):
#   1. Start with nginx.prod.conf.http-only (below)
#   2. Run: docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm certbot
#   3. Switch to this file and restart nginx
# ============================================================

# Worker processes drop privileges; master stays root to bind
# :80/:443 (ACME + TLS termination).
user nginx;

# --- HTTP server: ACME challenge, healthcheck + redirect to HTTPS ---
server {
    listen 80;
    server_name _;

    # Container healthcheck without TLS/cert gymnastics.
    location = /healthz {
        access_log off;
        return 200;
    }

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Security headers. Defined ONCE here and included at the server level
# AND in every location that sets its own headers: nginx add_header is
# not inherited into a block that has its own add_header, so the
# locations below would otherwise silently drop CSP/HSTS.
# The Cache-Control values live in `expires`, which never interferes
# with add_header inheritance.
#
# CSP note: fonts.googleapis.com is allow-listed for the Google Fonts
# stylesheet (style-src). font-src allows fonts.gstatic.com for the
# actual font files. Self-hosting the fonts would remove this third-party
# dependency entirely and is the preferred next step.
set $sec_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss: ws:; worker-src 'self' blob:; font-src 'self' https://fonts.gstatic.com";
set $sec_hsts "max-age=63072000; includeSubDomains; preload";
set $sec_nosniff "nosniff";
set $sec_frame "DENY";
set $sec_ref "no-referrer";
set $sec_perm "geolocation=(), microphone=(), camera=()";

# --- HTTPS server ---------------------------------------------
server {
    listen 443 ssl http2;
    server_name _;

    # --- TLS certificates (Let's Encrypt) ---
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    # --- TLS hardening ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # --- HSTS (now safe because we're on HTTPS) ---
    add_header Strict-Transport-Security "$sec_hsts" always;

    # --- Security headers ---
    add_header X-Content-Type-Options "$sec_nosniff" always;
    add_header X-Frame-Options "$sec_frame" always;
    add_header Referrer-Policy "$sec_ref" always;
    add_header Permissions-Policy "$sec_perm" always;
    add_header Content-Security-Policy "$sec_csp" always;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 600m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml font/woff2;

    location = /index.html {
        # expires never resets add_header inheritance, so the
        # security headers above still reach this response.
        expires -1;
        add_header Strict-Transport-Security "$sec_hsts" always;
        add_header X-Content-Type-Options "$sec_nosniff" always;
        add_header X-Frame-Options "$sec_frame" always;
        add_header Referrer-Policy "$sec_ref" always;
        add_header Permissions-Policy "$sec_perm" always;
        add_header Content-Security-Policy "$sec_csp" always;
    }

    location /assets/ {
        expires 1y;
        add_header Strict-Transport-Security "$sec_hsts" always;
        add_header X-Content-Type-Options "$sec_nosniff" always;
        add_header X-Frame-Options "$sec_frame" always;
        add_header Referrer-Policy "$sec_ref" always;
        add_header Permissions-Policy "$sec_perm" always;
        add_header Content-Security-Policy "$sec_csp" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    location ~ /\. {
        deny all;
    }
}
