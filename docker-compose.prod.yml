services:
  coturn:
    environment:
      TURN_SECRET: "${TURN_SECRET:?Set TURN_SECRET in production}"
      TURN_REALM: "${TURN_REALM:?Set TURN_REALM in production}"

  backend:
    restart: always
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    deploy:
      replicas: 2
    volumes:
      - uploads:/app/uploads
    environment:
      APP_ENV: "production"
      DEBUG: "false"
      COOKIE_SECURE: "true"
      # The app connects as the least-privilege nexara_app role so RLS
      # (FORCE ROW LEVEL SECURITY) is actually enforced. The superuser
      # nexara role is used only by backend-migrate below. The role is
      # created and its password set by the migration r2s4t6v8w0a3.
      DATABASE_URL: "postgresql+asyncpg://nexara_app:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in production}@postgres:5432/nexara"
      SKIP_MIGRATIONS: "true"
      # The mobile app is a Capacitor WebView served from
      # https://localhost, so its refresh cookie is third-party.
      # SameSite=Strict is never sent on that cross-site request,
      # which logs the user out on every cold start.
      COOKIE_SAMESITE: "None"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in production}"
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in production}"
      FRONTEND_URL: "${FRONTEND_URL:?Set FRONTEND_URL in production}"
      SMTP_HOST: "${SMTP_HOST:?Set SMTP_HOST in production}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:?Set SMTP_USERNAME in production}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:?Set SMTP_PASSWORD in production}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL:?Set SMTP_FROM_EMAIL in production}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME:-Nexara}"
      # https://localhost is the Capacitor WebView origin for the mobile
      # app; appended so the native client is never locked out by an
      # operator-set web-only origin list.
      CORS_ORIGINS: "${CORS_ORIGINS:?Set CORS_ORIGINS in production},https://localhost"
      TURN_URLS: "${TURN_URLS:-turn:coturn:3478?transport=udp}"
      TURN_USERNAME: "nexara"
      TURN_PASSWORD: "${TURN_SECRET:?Set TURN_SECRET in production}"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-4}"
      REDIS_URL: "${REDIS_URL:?Set REDIS_URL in production}"

  # One-shot migration job: runs as the migration (superuser) role, then
  # sets the nexara_app role password. App backends depend on its success
  # and never touch migrations themselves (SKIP_MIGRATIONS=true), so the
  # prod replicas can't race each other on alembic.
  backend-migrate:
    build: ./backend
    image: nexara-backend:latest
    environment:
      MIGRATE_ONLY: "true"
      NEXARA_APP_PASSWORD: "${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in production (must match backend)}"
      DATABASE_URL: "postgresql+asyncpg://nexara:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in production}@postgres:5432/nexara"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  frontend:
    restart: always
    volumes:
      # Mounted as a template: the nginx image entrypoint envsubsts it
      # with the DOMAIN env var into /etc/nginx/conf.d/default.conf.
      - ./frontend/nginx.prod.conf:/etc/nginx/templates/default.conf.template:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    environment:
      DOMAIN: "${DOMAIN:?Set DOMAIN in production (used for ACME and nginx TLS cert paths)}"

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"

  postgres-backup:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGUSER: "${POSTGRES_USER:-nexara}"
      PGPASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in production}"
      PGDATABASE: "${POSTGRES_DB:-nexara}"
      BACKUP_PASSPHRASE: "${BACKUP_PASSPHRASE:?Set BACKUP_PASSPHRASE in production (backups are encrypted, fail-closed)}"
    volumes:
      - pgbackups:/backups
    entrypoint: >
      sh -c '
        apk add --no-cache bash findutils openssl > /dev/null 2>&1;
        echo "#!/bin/bash
        set -euo pipefail
        TIMESTAMP=$$(date +%Y%m%d_%H%M%S)
        pg_dump -Fc | gzip | openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt -pass env:BACKUP_PASSPHRASE > /backups/nexara_$$TIMESTAMP.sql.gz.enc
        find /backups -name "nexara_*.sql.gz.enc" -mtime +30 -delete 2>/dev/null
        " > /backup.sh && chmod +x /backup.sh;
        trap exit TERM;
        while :; do
          /backup.sh;
          echo "[$$(date)] Backup completed";
          sleep 24h & wait $${!};
        done
      '
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

volumes:
  pgdata:
  pgbackups:
  certbot-www:
  certbot-conf:
  uploads:
